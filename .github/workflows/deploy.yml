# Builds the site (node tools/build.mjs) and publishes it to GitHub Pages.
#
# Runs on every push to main (e.g. a new post in content/blog/), once a day
# (so posts dated in the future appear on their date) and by hand.
# Needs: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 5 * * *"   # daily, 05:15 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (fails if a blog post is invalid)
        run: node tools/build.mjs
      - name: Collect the public files
        run: |
          mkdir _site
          tar --exclude=./_site --exclude=./.git --exclude=./.github --exclude=./content \
              --exclude=./tools --exclude=./docs --exclude=./README.md -cf - . | tar -xf - -C _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

            </ul>
            <h3 class="col-title col-title-gap" data-i18n="dep.title"></h3>
            <dl class="deploy-list">
              <div class="deploy-row"><dt data-i18n="dep.onprem"></dt><dd><span class="badge badge-now" data-i18n="dep.now"></span></dd></div>
              <div class="deploy-row"><dt data-i18n="dep.docker"></dt><dd><span class="badge" data-i18n="dep.soon"></span></dd></div>
              <div class="deploy-row"><dt data-i18n="dep.cloud"></dt><dd><span class="badge" data-i18n="dep.soon"></span></dd></div>
            </dl>
          </div>

          <aside class="ai-panel" id="ai" aria-labelledby="ai-title">
            <h3 id="ai-title" data-i18n="ai.title"></h3>
            <p class="muted" data-i18n="ai.lead"></p>
            <ul class="checklist">
              <li><svg class="icon" aria-hidden="true"><use href="#i-power"/></svg><p><strong data-i18n="ai.f1.t"></strong> <span data-i18n="ai.f1.d"></span></p></li>
              <li><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><p><strong data-i18n="ai.f2.t"></strong> <span data-i18n="ai.f2.d"></span></p></li>
              <li><svg class="icon" aria-hidden="true"><use href="#i-budget"/></svg><p><strong data-i18n="ai.f3.t"></strong> <span data-i18n="ai.f3.d"></span></p></li>
              <li><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg><p><strong data-i18n="ai.f4.t"></strong> <span data-i18n="ai.f4.d"></span></p></li>
              <li><svg class="icon" aria-hidden="true"><use href="#i-image"/></svg><p><strong data-i18n="ai.f5.t"></strong> <span data-i18n="ai.f5.d"></span></p></li>
            </ul>
          </aside>
        </div>
      </div>
    </section>

    <!-- 5. FAQ -->
    <section class="section" id="faq" aria-labelledby="faq-title">
      <div class="container split" data-reveal>
        <header class="split-head">
          <h2 id="faq-title" data-i18n="faq.title"></h2>
        </header>
        <div class="faq">
          <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
          <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
          <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
          <details><summary data-i18n="faq.q4"></summary><p data-i18n="faq.a4"></p></details>
          <details><summary data-i18n="faq.q5"></summary><p data-i18n="faq.a5"></p></details>
          <details><summary data-i18n="faq.q6"></summary><p data-i18n="faq.a6"></p></details>
          <details><summary data-i18n="faq.q7"></summary><p data-i18n="faq.a7"></p></details>
          <details><summary data-i18n="faq.q8"></summary><p data-i18n="faq.a8"></p></details>
        </div>
      </div>
    </section>

    <!-- 6. Contact -->
    <section class="section section-alt" id="contact" aria-labelledby="contact-title">
      <div class="container split" data-reveal>
        <header class="split-head">
          <h2 id="contact-title" data-i18n="contact.title"></h2>
          <p class="lead" data-i18n="contact.lead"></p>
          <p class="contact-direct">
            <svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>
            <span><span data-i18n="form.direct"></span><br><a data-config-mail></a></span>
          </p>
        </header>
        <form class="contact-form" id="contact-form" novalidate>
          <div class="field">
            <label for="f-name"><span data-i18n="form.name"></span> <span class="req" aria-hidden="true">*</span></label>
            <input id="f-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="f-company"><span data-i18n="form.company"></span> <span class="req" aria-hidden="true">*</span></label>
            <input id="f-company" name="company" type="text" autocomplete="organization" required>
          </div>
          <div class="field">
            <label for="f-email"><span data-i18n="form.email"></span> <span class="req" aria-hidden="true">*</span></label>
            <input id="f-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="f-phone" data-i18n="form.phone"></label>
            <input id="f-phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <fieldset class="field field-full">
            <legend data-i18n="form.interest"></legend>
            <div class="radio-row">
              <label><input type="radio" name="interest" value="form.i1"> <span data-i18n="form.i1"></span></label>
              <label><input type="radio" name="interest" value="form.i2"> <span data-i18n="form.i2"></span></label>
              <label><input type="radio" name="interest" value="form.i3" checked> <span data-i18n="form.i3"></span></label>
            </div>
          </fieldset>
          <div class="field field-full">
            <label for="f-message"><span data-i18n="form.message"></span> <span class="req" aria-hidden="true">*</span></label>
            <textarea id="f-message" name="message" rows="5" required></textarea>
          </div>
          <div class="field-full form-footer">
            <button class="btn btn-primary" type="submit">
              <svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>
              <span data-i18n="form.submit"></span>
            </button>
            <p class="form-status" role="status" aria-live="polite" data-form-status></p>
            <p class="muted" data-i18n="form.note"></p>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p class="brand brand-footer">
          <svg class="brand-logo" aria-hidden="true"><use href="#i-logo"/></svg>
          <span data-config="productName">VisionInspect</span>
        </p>
        <p class="muted">&copy; <span data-year></span> <span data-config="company"></span> &middot; <span data-config="address"></span></p>
        <p class="muted" data-i18n="footer.note"></p>
      </div>
      <ul class="footer-links">
        <li><a href="imprint.html" data-i18n="footer.imprint"></a></li>
        <li><a href="privacy.html" data-i18n="footer.privacy"></a></li>
        <li><a data-config-mail></a></li>
      </ul>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
